# 第6回 CI/CD ワークフロー
# main への push で: テスト → ビルド＆ECR push → ECS Express Mode へデプロイ
#
# 事前準備（スライド 19〜20 ページ）:
#   - 第5回で作った ma2-github-actions-role に、ECS デプロイ用の権限を追加する
#   - GitHub の Secrets に AWS_ROLE_ARN（第5回で登録済み）と AWS_ACCOUNT_ID を登録する
name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: ma2-app
  SERVICE_NAME: ma2-app

jobs:
  # ---------- ① テスト（落ちたら以降のジョブは動かない） ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt
      - working-directory: app
        run: python -m unittest discover -s tests -v

  # ---------- ② ビルドして ECR に push ----------
  build-and-push:
    needs: test                     # ← test が成功しないと実行されない
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE" -t "$REGISTRY/$ECR_REPOSITORY:latest" app
          docker push "$IMAGE"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"     # ③ に渡す

  # ---------- ③ ECS Express Mode にデプロイ ----------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: deploy
        uses: aws-actions/amazon-ecs-deploy-express-service@v1.2.2
        with:
          service-name: ${{ env.SERVICE_NAME }}
          image: ${{ needs.build-and-push.outputs.image }}
          execution-role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ecsTaskExecutionRole
          infrastructure-role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ecsInfrastructureRoleForExpressServices
          container-port: 5000
          health-check-path: /health

      - name: 公開 URL を表示
        run: |
          echo "サービス ARN: ${{ steps.deploy.outputs.service-arn }}"
          echo "公開 URL   : ${{ steps.deploy.outputs.endpoint }}"
